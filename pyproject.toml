[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flagpilot"
version = "0.1.0"
description = "Self-hosted terminal tool for staged flag rollouts on Flagsmith."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests",
    "python-dotenv",
    "flagsmith",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
flagpilot = "flagpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: integration tests requiring a live self-hosted Flagsmith server at http://localhost:8000",
]

[tool.ruff]
target-version = "py311"
line-length = 100

